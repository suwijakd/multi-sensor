; ESP32-C3 Super Mini — wearable multi-sensor logger
; PPG (SEN0203, analog) + GSR (Grove v1.2, analog) + ICM-20948 (I2C) + MLX90614 (I2C)
;
; PlatformIO is ONE of three supported toolchains (see README.md). All three
; compile the same sketch in arduino/multi_sensor/, so src_dir points there.

[platformio]
src_dir = arduino/multi_sensor

[env:esp32-c3-supermini]
platform  = espressif32
board     = esp32-c3-devkitm-1   ; Super Mini is a C3 + 4MB flash; this board profile fits
framework = arduino

monitor_speed   = 115200
monitor_filters = colorize, time

; Native USB CDC: makes `Serial` the USB port (no UART-to-USB chip on the Super Mini).
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    adafruit/Adafruit ICM20X@^2.0.7
    adafruit/Adafruit MLX90614 Library@^2.1.5
    ; (Adafruit BusIO + Adafruit Unified Sensor are pulled in automatically)

; If `pio run -t upload` can't find the board, uncomment and set your port:
; upload_port = COM5
; monitor_port = COM5
